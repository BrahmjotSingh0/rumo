server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No X-Frame-Options/frame-ancestors here on purpose: embedding this app
    # in an iframe is a supported, default-on feature (see docs/EMBEDDING.md
    # and the "embedding" flag in /admin), and that flag is a runtime DB
    # value the app itself enforces (main.jsx breaks out of the frame when
    # it's off) - a static header here can't be toggled the same way without
    # rebuilding the image, and would block embedding outright either way.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Only restricts features Rumo never uses - camera/microphone/display-
    # capture/autoplay/fullscreen are deliberately left alone since the app
    # needs them (including when embedded, via the allow attribute embed.js
    # sets on its iframe).
    add_header Permissions-Policy "geolocation=(), payment=(), usb=(), midi=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;

    # __RUMO_CONNECT_SRC_EXTRA__ is filled in at image build time (see
    # Dockerfile) from this deployment's own VITE_API_URL/VITE_SOCKET_URL/
    # VITE_TURN_URL, since those are runtime-configurable per self-hosted
    # instance and a hardcoded policy would break WebRTC/websocket
    # connections for anyone whose backend isn't on this same origin.
    # script-src needs 'wasm-unsafe-eval' for the RNNoise WebAssembly module,
    # and cdn.jsdelivr.net for the optional TensorFlow.js/BodyPix background
    # segmentation model it loads on demand (storage.googleapis.com in
    # connect-src is where that model's weights are hosted).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com stun: turn: __RUMO_CONNECT_SRC_EXTRA__; worker-src 'self'; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
