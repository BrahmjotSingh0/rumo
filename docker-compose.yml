services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rumo}
      POSTGRES_USER: ${DB_USER:-rumo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rumo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rumo}
      DB_USER: ${DB_USER:-rumo}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      CORS_CREDENTIALS: "false"
      STUN_SERVERS: ${STUN_SERVERS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
      TURN_SERVERS: ${TURN_SERVERS:-}
      UPLOAD_PATH: /app/uploads
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bound to localhost only when DOMAIN is set (see install.sh) - Caddy is
      # the public entry point in that case, this stays reachable for debugging.
      - "${BIND_ADDR:-0.0.0.0}:${BACKEND_PORT:-5000}:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
        # Optional TURN server for the frontend's own ICE config. VITE_TURN_URL
        # also widens the built Content-Security-Policy (connect-src) so a
        # custom TURN server isn't blocked by it - see frontend/Dockerfile.
        # Safe to leave all three unset.
        VITE_TURN_URL: ${VITE_TURN_URL:-}
        VITE_TURN_USERNAME: ${VITE_TURN_USERNAME:-}
        VITE_TURN_CREDENTIAL: ${VITE_TURN_CREDENTIAL:-}
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    # To re-brand without rebuilding the image, bind-mount your own branding.json
    # (or use the admin panel at /admin instead - no rebuild or restart needed):
    # volumes:
    #   - ./my-branding.json:/usr/share/nginx/html/branding.json:ro

  # Optional reverse proxy with automatic HTTPS. Only starts when you run
  # `docker compose --profile proxy up -d`, which install.sh does for you if
  # you give it a domain. See Caddyfile.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  backend_uploads:
  caddy_data:
  caddy_config:
